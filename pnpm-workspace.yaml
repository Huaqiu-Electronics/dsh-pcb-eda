packages:
  - 'packages/*'
minimumReleaseAgeExclude:
  - '@huaqiu/dsh-artifacts@0.3.3'
  - '@huaqiu/dsh-auth@0.3.3'
  - '@hqedge/paths@0.1.2'

# rc.2's public Job Registry types import dsh-session without declaring its peer.
# Bind it to the consumer's SDK instead of an unrelated hoisted Cordis 4.0.2 copy.
packageExtensions:
  '@deepseek-ai/dsh-jobs-local@0.1.7-rc.2':
    peerDependencies:
      '@deepseek-ai/dsh-session': '0.1.7-rc.2'
