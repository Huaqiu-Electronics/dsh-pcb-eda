# @huaqiu/dsh-tool-pcb-viewer 的 bundle 补丁：把插件条目插入 loader 树，host 半边由此加载。
#
# The entry `inject` MUST match the node-half module contract (`src/index.ts`
# `export const inject = ['tools', 'webServer', 'sessions']`). It used to be
# absent, which left this row without an activation gate: the plugin mounted
# before `webServer` / `sessions` existed and its route registration ran against
# an undefined service. The gate is now explicit.
- insert:
    - id: dsh-tool-pcb-viewer
      name: '@huaqiu/dsh-tool-pcb-viewer'
      inject: ['tools', 'webServer', 'sessions']
