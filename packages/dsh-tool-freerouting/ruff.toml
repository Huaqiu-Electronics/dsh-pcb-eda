# First-party helpers only; bundled dependencies retain their upstream source.
target-version = "py311"
line-length = 100
extend-exclude = ["python/vendor", "python/__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[lint.per-file-ignores]
# Standalone KiCad tests intentionally bootstrap sibling/vendor imports.
"python/tests/*.py" = ["E402"]
"scripts/probe-export.py" = ["E402"]
